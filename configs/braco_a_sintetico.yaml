# braco_a_sintetico.yaml
# Arm A' — Synthetic in-place composition (MAIN RESULT)

name: "Arm A' — In-place synthetic composition"
description: >
  Pre-train on synthetic dataset generated by in-place substitution:
  real vessels in CITRA-3D-Real replaced by SAM-segmented crops from
  InaTechShips at the same position and scale. Then fine-tune on
  CITRA-3D-Real.
pipeline: "COCO → dataset_sintetico (100 ep) → CITRA-3D-Real (300 ep)"

pretrain:
  data: "dataset_sintetico"
  data_size: 27796
  n_objects: 93480
  avg_objects_per_image: 3.36
  generation_method: "in-place substitution (v3)"
  crops_source: "InaTechShips dataset_25k_v2 (SAM segmentation)"
  crops_available: 23828  # after quality filter
  backgrounds_source: "CITRA-3D-Real (all 2081 images)"
  variations_per_image: 13
  epochs: 100
  patience: 20

finetune:
  data: "CITRA-3D-Real"
  epochs: 300
  patience: 30

seeds: [42, 123, 2024]

results:
  per_seed:
    seed_42:  { mAP50: 0.8561, mAP50_95: 0.5309 }
    seed_123: { mAP50: 0.8491, mAP50_95: 0.5216 }
    seed_2024: { mAP50: 0.8570, mAP50_95: 0.5318 }
  mean:
    mAP50: "0.8541 ± 0.0043"
    mAP50_95: "0.5281 ± 0.0056"
  delta_vs_B2: "+1.90%"
  confidence_intervals:
    A_prime: [0.8498, 0.8584]
    B2: [0.8327, 0.8375]
    overlap: false
    separation_sigma: 7.9
  interpretation: >
    POSITIVE RESULT. In-place synthetic composition resolves the domain
    gap and produces a statistically significant improvement over COCO
    baseline. The same InaTechShips images that caused −4.15% degradation
    (arm A) now produce +1.90% improvement when adapted to the
    operational domain.
