# braco_a_sintetico.yaml
# Arm A' — Synthetic in-place composition v4 (MAIN RESULT)

name: "Arm A' — In-place synthetic composition (v4, leak-free)"
description: >
  Pre-train on synthetic dataset generated by in-place substitution.
  Version 4: each synthetic partition generated exclusively from the
  corresponding CITRA-3D-Real partition. No test backgrounds in
  synthetic train. This fixes the data leakage present in v3.
pipeline: "COCO → dataset_sintetico_v4 (100 ep) → CITRA-3D-Real (300 ep)"

pretrain:
  data: "dataset_sintetico_v4"
  data_size: 27053
  n_objects: 91035
  avg_objects_per_image: 3.37
  generation_method: "in-place substitution (v4, split-isolated)"
  data_leakage_fix: >
    Each synthetic split generated ONLY from corresponding CITRA-3D-Real
    split. No test backgrounds in synthetic train.
  splits:
    train: { images: 17524, objects: 58354 }
    val: { images: 4316, objects: 16470 }
    test: { images: 5213, objects: 16211 }
  crops_source: "InaTechShips (SAM segmentation)"
  variations_per_image: 13
  epochs: 100
  patience: 20

finetune:
  data: "CITRA-3D-Real"
  epochs: 300
  patience: 30

seeds: [42, 123, 2024]

results:
  note: "Awaiting v4 results (v3 had data leakage)"
  v3_results_deprecated:
    mAP50: "0.8541 ± 0.0043 (INVALIDATED — data leakage)"
