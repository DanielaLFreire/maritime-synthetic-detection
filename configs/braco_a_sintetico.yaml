# braco_a_sintetico.yaml
# Arm A' — In-place synthetic composition (sequential pre-training)

name: "Arm A' sequential — In-place synthetic composition"
description: >
  Pre-train on synthetic dataset generated by in-place substitution.
  Each synthetic partition generated exclusively from the corresponding
  CITRA-3D-Real partition.
pipeline: "COCO → dataset_sintetico (100 ep) → CITRA-3D-Real (300 ep)"

pretrain:
  data: "dataset_sintetico"
  data_size: 27053
  n_objects: 91035
  avg_objects_per_image: 3.37
  generation_method: "in-place substitution"
  splits:
    train: { images: 17524, objects: 58354 }
    val: { images: 4316, objects: 16470 }
    test: { images: 5213, objects: 16211 }
  epochs: 100
  patience: 20

finetune:
  data: "CITRA-3D-Real"
  epochs: 300
  patience: 30

seeds: [42, 123, 2024]

results:
  per_seed:
    seed_42:   { mAP50: 0.8168, mAP50_95: 0.4871 }
    seed_123:  { mAP50: 0.8340, mAP50_95: 0.5012 }
    seed_2024: { mAP50: 0.8153, mAP50_95: 0.4917 }
  mean:
    mAP50: "0.8221 ± 0.0085"
    mAP50_95: "0.4933 ± 0.0059"
  delta_vs_B2: "-1.31 pp"
  interpretation: >
    Sequential pre-training reduces negative transfer from -4.15 to
    -1.31 pp but does not eliminate it. Catastrophic forgetting persists
    even with domain-adapted synthetic data.
