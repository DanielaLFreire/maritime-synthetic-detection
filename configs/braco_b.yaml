# braco_b.yaml
# Arm B — Random subset (3 seeds)

name: "Arm B — Random InaTechShips subset"
description: >
  Pre-train on random_pool_v2 (random subset of InaTechShips, same
  size as dataset_25k_v2 but without CLIP curation), then fine-tune
  on CITRA-3D-Real. Confirms that negative transfer is independent
  of curation strategy (B ≈ A).
pipeline: "COCO → random_pool_v2 (100 ep) → CITRA-3D-Real (300 ep)"

pretrain:
  data: "random_pool_v2"
  data_size: 27964
  epochs: 100
  patience: 20

finetune:
  data: "CITRA-3D-Real"
  epochs: 300
  patience: 30

seeds: [42, 123, 2024]

results:
  note: "Awaiting seeds 123 and 2024"
  seed_42: { mAP50: 0.7997, mAP50_95: 0.4711 }
